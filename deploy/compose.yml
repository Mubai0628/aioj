name: ${COMPOSE_PROJECT_NAME:-aioj-local}

# Same bounded json-file logs as compose.production.yml, so a long local run cannot fill the disk.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    profiles: ["core", "infra"]
    command: --innodb-buffer-pool-size=256M --max-connections=50
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_oj_next}
      MYSQL_USER: ${MYSQL_USER:-aioj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD, see .env.example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD, see .env.example}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 640m
    cpus: "0.75"

  redis:
    image: redis:7.4-alpine
    profiles: ["core", "infra"]
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 64mb --maxmemory-policy allkeys-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-me}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 96m
    cpus: "0.25"

  rabbitmq:
    image: rabbitmq:4.4-management
    profiles: ["core", "infra"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aioj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-rabbit-me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 256m
    cpus: "0.50"

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 192m
    cpus: "0.25"

  grafana:
    image: grafana/grafana:12.4.13
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 192m
    cpus: "0.25"

  gateway-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: gateway-service
    environment:
      SERVER_PORT: 8101
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
      AUTH_SERVICE_URI: http://auth-service:8201
      PROBLEM_SERVICE_URI: http://problem-service:8202
      AI_SERVICE_URI: http://ai-service:8204
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-240s}
      AI_GATEWAY_RESPONSE_TIMEOUT_MS: ${AI_GATEWAY_RESPONSE_TIMEOUT_MS:-900000}
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:-10000}
      # Per-address token buckets (T2.2); a Redis outage lets requests through.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-me}
      GATEWAY_TRUSTED_PROXY_HOPS: ${GATEWAY_TRUSTED_PROXY_HOPS:-1}
      GATEWAY_RATE_LIMIT_SHARED_NETWORKS: ${GATEWAY_RATE_LIMIT_SHARED_NETWORKS:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8101}:8101"
    depends_on:
      auth-service:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8101/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 320m
    cpus: "0.35"

  auth-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: auth-service
    environment:
      SERVER_PORT: 8201
      JAVA_OPTS: ${AUTH_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_oj_next}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-aioj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD, see .env.example}
      AUTH_DB_POOL_MAX: ${AUTH_DB_POOL_MAX:-4}
      AUTH_DB_POOL_MIN_IDLE: ${AUTH_DB_POOL_MIN_IDLE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      FLYWAY_ENABLED: ${AUTH_FLYWAY_ENABLED:-true}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-replace-with-at-least-32-bytes-dev-secret}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8201/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 384m
    cpus: "0.35"

  problem-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: problem-service
    environment:
      AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM: ${AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM:-}
      AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM: ${AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM:-}
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI:-}
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE:-}
      AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM_NEXT: ${AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM_NEXT:-}
      AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM_NEXT: ${AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM_NEXT:-}
      SERVER_PORT: 8202
      JAVA_OPTS: ${PROBLEM_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_oj_next}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-aioj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD, see .env.example}
      PROBLEM_DB_POOL_MAX: ${PROBLEM_DB_POOL_MAX:-12}
      PROBLEM_DB_POOL_MIN_IDLE: ${PROBLEM_DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aioj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-rabbit-me}
      FLYWAY_ENABLED: ${PROBLEM_FLYWAY_ENABLED:-false}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-replace-with-at-least-32-bytes-dev-secret}
      AI_SERVICE_URI: http://ai-service:8204
      JUDGE_WORKER_BASE_URL: http://judge-worker:8203
      AIOJ_TESTCASE_STORAGE_ROOT: /aioj/testcases
      AIOJ_OPERATION_ARTIFACT_ROOT: /aioj/operation-artifacts
      AIOJ_OPERATION_EXECUTOR_POOL_SIZE: ${AIOJ_OPERATION_EXECUTOR_POOL_SIZE:-2}
      AIOJ_OPERATION_POLL_BATCH_SIZE: ${AIOJ_OPERATION_POLL_BATCH_SIZE:-3}
      AIOJ_PLAGIARISM_EXECUTOR_POOL_SIZE: ${AIOJ_PLAGIARISM_EXECUTOR_POOL_SIZE:-1}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    volumes:
      - problem-testcases:/aioj/testcases
      - operation-artifacts:/aioj/operation-artifacts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8202/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 640m
    cpus: "0.65"

  ai-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: ai-service
    environment:
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI:-}
      AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM: ${AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM:-}
      AGENT_EXECUTOR_INTERNAL_TOKEN: ${AGENT_EXECUTOR_INTERNAL_TOKEN:-}
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI_NEXT: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI_NEXT:-}
      SERVER_PORT: 8204
      JAVA_OPTS: ${AI_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_oj_next}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-aioj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD, see .env.example}
      AI_DB_POOL_MAX: ${AI_DB_POOL_MAX:-6}
      AI_DB_POOL_MIN_IDLE: ${AI_DB_POOL_MIN_IDLE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-me}
      FLYWAY_ENABLED: ${AI_FLYWAY_ENABLED:-false}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-replace-with-at-least-32-bytes-dev-secret}
      PROBLEM_SERVICE_URI: http://problem-service:8202
      # Plan T1.10: draft code runs in agent-executor; ai-service holds no sandbox token.
      AGENT_EXECUTOR_ENDPOINT: ${AGENT_EXECUTOR_ENDPOINT:-http://agent-executor:8205}
      AGENT_EXECUTOR_MAX_MEMORY_LIMIT_KB: ${AGENT_EXECUTOR_MAX_MEMORY_LIMIT_KB:-262144}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      # Kimi was retired on 2026-10-29 (phase 1, batch 6); kept commented out so it can come back.
      # MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1/chat/completions}
      # MOONSHOT_MODEL: ${MOONSHOT_MODEL:-}
      # KIMI_API_KEY: ${KIMI_API_KEY:-}
      # KIMI_MODEL: ${KIMI_MODEL:-}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      AI_HTTP_CONNECT_TIMEOUT_MS: ${AI_HTTP_CONNECT_TIMEOUT_MS:-10000}
      AI_HTTP_READ_TIMEOUT_MS: ${AI_HTTP_READ_TIMEOUT_MS:-300000}
      AI_CHAT_CORE_POOL_SIZE: ${AI_CHAT_CORE_POOL_SIZE:-2}
      AI_SCHEDULING_POOL_SIZE: ${AI_SCHEDULING_POOL_SIZE:-4}
      AI_CHAT_MAX_POOL_SIZE: ${AI_CHAT_MAX_POOL_SIZE:-4}
      AI_CHAT_QUEUE_CAPACITY: ${AI_CHAT_QUEUE_CAPACITY:-32}
      AI_STUDENT_ASSISTANT_CONCURRENCY: ${AI_STUDENT_ASSISTANT_CONCURRENCY:-4}
      AI_PROBLEM_DRAFT_CONCURRENCY: ${AI_PROBLEM_DRAFT_CONCURRENCY:-1}
      AI_INTENT_MEMORY_CONCURRENCY: ${AI_INTENT_MEMORY_CONCURRENCY:-2}
      AI_BATCH_REPORT_CONCURRENCY: ${AI_BATCH_REPORT_CONCURRENCY:-1}
      AI_INTENT_ENABLED: ${AI_INTENT_ENABLED:-true}
      DEEPSEEK_INTENT_BASE_URL: ${DEEPSEEK_INTENT_BASE_URL:-${DEEPSEEK_BASE_URL:-https://api.deepseek.com/chat/completions}}
      DEEPSEEK_INTENT_MODEL: ${DEEPSEEK_INTENT_MODEL:-${DEEPSEEK_MODEL:-deepseek-v4-pro}}
      AI_EMBEDDING_ENABLED: ${AI_EMBEDDING_ENABLED:-false}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # Plan S6 (T2.6): off locally so a developer's data stays; production turns it on.
      AI_RETENTION_ENABLED: ${AI_RETENTION_ENABLED:-false}
      AI_RETENTION_DRY_RUN: ${AI_RETENTION_DRY_RUN:-false}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8204/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 640m
    cpus: "0.65"

  judge-worker:
    profiles: ["judge"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: judge-worker
    environment:
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE:-}
      AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM: ${AIOJ_INTERNAL_TOKEN_JUDGE_TO_PROBLEM:-}
      AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE_NEXT: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_JUDGE_NEXT:-}
      SERVER_PORT: 8203
      JAVA_OPTS: ${JUDGE_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}
      MYSQL_URL: ${MYSQL_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_oj_next}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      MYSQL_USER: ${MYSQL_USER:-aioj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD, see .env.example}
      JUDGE_DB_POOL_MAX: ${JUDGE_DB_POOL_MAX:-4}
      JUDGE_DB_POOL_MIN_IDLE: ${JUDGE_DB_POOL_MIN_IDLE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aioj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-rabbit-me}
      AIOJ_JUDGE_CACHE_ROOT: /aioj/cases
      SANDBOX_ENDPOINT: ${SANDBOX_ENDPOINT:-http://sandbox:8090/execute}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      PROBLEM_SERVICE_BASE_URL: ${PROBLEM_SERVICE_BASE_URL:-http://problem-service:8202}
      JUDGE_PREFETCH: ${JUDGE_PREFETCH:-2}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      JUDGE_MAX_CONCURRENCY: ${JUDGE_MAX_CONCURRENCY:-2}
      JUDGE_STDOUT_BASE_COLLECT_LIMIT_BYTES: ${JUDGE_STDOUT_BASE_COLLECT_LIMIT_BYTES:-32768}
      JUDGE_STDOUT_EXTRA_COLLECT_BYTES: ${JUDGE_STDOUT_EXTRA_COLLECT_BYTES:-32768}
      JUDGE_STDOUT_MAX_COLLECT_LIMIT_BYTES: ${JUDGE_STDOUT_MAX_COLLECT_LIMIT_BYTES:-1048576}
      JUDGE_STDERR_COLLECT_LIMIT_BYTES: ${JUDGE_STDERR_COLLECT_LIMIT_BYTES:-32768}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
    volumes:
      - testcase-cache:/aioj/cases
    networks:
      - default
      - aioj-judge
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8203/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 384m
    cpus: "0.50"

  sandbox:
    profiles: ["judge"]
    build:
      context: sandbox
    privileged: true
    shm_size: 256m
    environment:
      ES_HTTP_ADDR: ":8090"
      ES_AUTH_TOKEN: ${SANDBOX_TOKEN:-}
      ES_OUTPUT_LIMIT: ${SANDBOX_OUTPUT_LIMIT:-67108864}
      ES_COPY_OUT_LIMIT: ${SANDBOX_COPY_OUT_LIMIT:-67108864}
      ES_FILE_TIMEOUT: ${SANDBOX_FILE_TIMEOUT:-10m}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - testcase-cache:/aioj/cases:ro
      - sandbox-tmp:/tmp
    networks:
      - aioj-judge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/version >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 960m
    cpus: "1.20"

  # Plan T1.9: the Agent tools' own sandbox and its executor, shaped like production
  # (compose.production.yml). The sandbox has no port and sits only on the internal
  # aioj-agent-sandbox network; services started with java -jar reach agent-executor
  # on its loopback port.
  agent-sandbox:
    profiles: ["agent"]
    build:
      context: sandbox
    privileged: true
    read_only: true
    shm_size: 64m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,size=192m,mode=1777
    environment:
      ES_HTTP_ADDR: ":8090"
      ES_AUTH_TOKEN: ${AGENT_SANDBOX_TOKEN:-}
      ES_OUTPUT_LIMIT: ${AGENT_SANDBOX_OUTPUT_LIMIT:-67108864}
      ES_COPY_OUT_LIMIT: ${AGENT_SANDBOX_COPY_OUT_LIMIT:-67108864}
      ES_FILE_TIMEOUT: ${AGENT_SANDBOX_FILE_TIMEOUT:-10m}
    networks:
      - aioj-agent-sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/version >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 512m
    cpus: "0.75"

  agent-executor:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        SERVICE_MODULE: agent-executor
    environment:
      AGENT_EXECUTOR_INTERNAL_TOKEN: ${AGENT_EXECUTOR_INTERNAL_TOKEN:-}
      AGENT_EXECUTOR_INTERNAL_TOKEN_NEXT: ${AGENT_EXECUTOR_INTERNAL_TOKEN_NEXT:-}
      JAVA_OPTS: ${AGENT_EXECUTOR_JAVA_OPTS:--XX:InitialRAMPercentage=15 -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}
      AGENT_SANDBOX_ENDPOINT: http://agent-sandbox:8090/execute
      AGENT_SANDBOX_TOKEN: ${AGENT_SANDBOX_TOKEN:-}
      AGENT_EXECUTOR_WORK_ROOT: /aioj/agent-work
      AGENT_EXECUTOR_MAX_CONCURRENCY: "1"
      # Plan T1.10: measured peaks in agent-sandbox were g++ 171-215 MiB, javac 55-143 MiB and a
      # 20-case package build 220 MiB, so runs get 256 MiB and compiles or generator scripts 384 MiB.
      AGENT_EXECUTOR_MAX_MEMORY_LIMIT_KB: ${AGENT_EXECUTOR_MAX_MEMORY_LIMIT_KB:-262144}
      AGENT_EXECUTOR_MAX_COMPILE_MEMORY_LIMIT_KB: ${AGENT_EXECUTOR_MAX_COMPILE_MEMORY_LIMIT_KB:-393216}
    ports:
      - "127.0.0.1:8205:8205"
    volumes:
      - agent-executor-work:/aioj/agent-work
    networks:
      - default
      - aioj-agent-sandbox
    depends_on:
      agent-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8205/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 256m
    cpus: "0.25"

  web-user:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        APP_WORKSPACE: "@aioj/web-user-react"
        APP_DIR: web-user-react
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${WEB_USER_PORT:-5173}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 64m
    cpus: "0.10"

  web-admin:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        APP_WORKSPACE: "@aioj/web-admin-react"
        APP_DIR: web-admin-react
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${WEB_ADMIN_PORT:-5174}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 64m
    cpus: "0.10"

