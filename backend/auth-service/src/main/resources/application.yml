server:
  port: ${SERVER_PORT:8201}

spring:
  autoconfigure:
    # JWT and internal tokens are the only logins; without this Boot prints a generated
    # password for a form login nobody uses into the startup log (T2.5).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: ai-oj-auth-service
  jackson:
    # Jackson 3 (Spring Boot 4): keep the Jackson 2 defaults this service was built against.
    use-jackson2-defaults: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_oj_next?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:aioj}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_MAX:4}
      minimum-idle: ${AUTH_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: true

aioj:
  auth:
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:false}
    login-attempt:
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      account-max-failures: ${AUTH_LOGIN_ACCOUNT_MAX_FAILURES:50}
      window: ${AUTH_LOGIN_WINDOW:PT15M}
      lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT15M}
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-oj-next}
      hmac-secret: ${JWT_HMAC_SECRET:replace-with-at-least-32-bytes-dev-secret}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
      access-ttl: ${JWT_ACCESS_TTL:PT2H}
      refresh-ttl: ${JWT_REFRESH_TTL:P14D}

logging:
  pattern:
    # Every line carries the request's trace id (T2.5); the brackets are empty when there is none.
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
