server:
  port: ${SERVER_PORT:8204}

spring:
  autoconfigure:
    # JWT and internal tokens are the only logins; without this Boot prints a generated
    # password for a form login nobody uses into the startup log (T2.5).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: ai-oj-ai-service
  jackson:
    # Jackson 3 (Spring Boot 4): keep the Jackson 2 defaults this service was built against.
    use-jackson2-defaults: true
  mvc:
    async:
      # SSE chat/draft streams legitimately run for minutes while the provider generates;
      # without an explicit value the container default (~30s) silently truncates them.
      request-timeout: ${AI_ASYNC_REQUEST_TIMEOUT_MS:600000}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_oj_next?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:aioj}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${AI_DB_POOL_MAX:6}
      minimum-idle: ${AI_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Limits and caches let requests through when Redis is down (T2.2); without a short timeout each
      # call first waited out Lettuce's 60 s default, holding a request thread the whole time.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    clean-disabled: true
  task:
    scheduling:
      pool:
        # Plan 15.4: the scheduled tasks (async jobs, draft jobs, channel metrics, two cleanups) get
        # their own threads, so a stuck job worker no longer holds back the draft job poll.
        size: ${AI_SCHEDULING_POOL_SIZE:4}

aioj:
  internal:
    inbound:
      problem-service:
        token: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI:}
        next-token: ${AIOJ_INTERNAL_TOKEN_PROBLEM_TO_AI_NEXT:}
    outbound:
      problem-service:
        token: ${AIOJ_INTERNAL_TOKEN_AI_TO_PROBLEM:}
      agent-executor:
        token: ${aioj.ai.agent-executor-token:}
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-oj-next}
      hmac-secret: ${JWT_HMAC_SECRET:replace-with-at-least-32-bytes-dev-secret}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  ai:
    provider: deepseek
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    problem-service-uri: ${PROBLEM_SERVICE_URI:http://localhost:8202}
    # Plan T1.10: Agent tool execution goes to agent-executor, never to judge-worker or a sandbox.
    agent-executor-uri: ${AGENT_EXECUTOR_ENDPOINT:http://localhost:8205}
    agent-executor-token: ${AGENT_EXECUTOR_INTERNAL_TOKEN:}
    agent-executor-max-memory-limit-kb: ${AGENT_EXECUTOR_MAX_MEMORY_LIMIT_KB:262144}
    # Plan S6 (T2.6): off unless the deployment turns it on, so a local stack keeps its data.
    retention:
      enabled: ${AI_RETENTION_ENABLED:false}
      dry-run: ${AI_RETENTION_DRY_RUN:false}
      cron: ${AI_RETENTION_CRON:0 30 3 * * *}
      deleted-conversations: ${AI_RETENTION_DELETED_CONVERSATIONS:30d}
      contest-conversations: ${AI_RETENTION_CONTEST_CONVERSATIONS:365d}
      run-traces: ${AI_RETENTION_RUN_TRACES:90d}
      deleted-drafts: ${AI_RETENTION_DELETED_DRAFTS:30d}
      retired-artifacts: ${AI_RETENTION_RETIRED_ARTIFACTS:30d}
      batch-size: ${AI_RETENTION_BATCH_SIZE:500}
      max-run-time: ${AI_RETENTION_MAX_RUN_TIME:10m}
    problem-draft:
      max-repair-attempts: ${AI_PROBLEM_DRAFT_MAX_REPAIR_ATTEMPTS:5}
      max-agent-steps: ${AI_PROBLEM_DRAFT_MAX_AGENT_STEPS:20}
      max-tool-calls: ${AI_PROBLEM_DRAFT_MAX_TOOL_CALLS:16}
      max-sandbox-calls: ${AI_PROBLEM_DRAFT_MAX_SANDBOX_CALLS:8}
      max-testcase-generations: ${AI_PROBLEM_DRAFT_MAX_TESTCASE_GENERATIONS:2}
      max-testcase-package-runs: ${AI_PROBLEM_DRAFT_MAX_TESTCASE_PACKAGE_RUNS:2}
      max-run-minutes: ${AI_PROBLEM_DRAFT_MAX_RUN_MINUTES:15}
      testcase-artifact-storage-root: ${AI_PROBLEM_DRAFT_TESTCASE_ARTIFACT_ROOT:${user.home}/.ai-oj-next/ai-draft-testcase-artifacts}
      max-official-case-bytes: ${AI_PROBLEM_DRAFT_MAX_OFFICIAL_CASE_BYTES:8388608}
      max-official-package-bytes: ${AI_PROBLEM_DRAFT_MAX_OFFICIAL_PACKAGE_BYTES:52428800}
      allowed-tags:
        - implementation
        - math
        - greedy
        - dp
        - binary_search
        - graphs
        - shortest_paths
        - trees
        - strings
        - data_structures
        - sorting
        - sortings
        - 数组
        - 哈希
        - 排序
        - 实现
        - 数学
        - 贪心
        - 动态规划
        - 二分
        - 图论
        - 最短路
        - 树
        - 字符串
        - 数据结构
    daily-limit: ${AI_DAILY_LIMIT:50}
    monthly-limit: ${AI_MONTHLY_LIMIT:1000}
    model-client:
      # Every Provider call goes through the model call package (plan T1.3); these keep
      # the two timeouts the deploy files already set. One attempt may take total-timeout.
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT_MS:10000}ms
      total-timeout: ${AI_HTTP_READ_TIMEOUT_MS:300000}ms
    capacity:
      chat-core-pool-size: ${AI_CHAT_CORE_POOL_SIZE:4}
      chat-max-pool-size: ${AI_CHAT_MAX_POOL_SIZE:8}
      chat-queue-capacity: ${AI_CHAT_QUEUE_CAPACITY:64}
      student-assistant-concurrency: ${AI_STUDENT_ASSISTANT_CONCURRENCY:8}
      problem-draft-concurrency: ${AI_PROBLEM_DRAFT_CONCURRENCY:2}
      intent-memory-concurrency: ${AI_INTENT_MEMORY_CONCURRENCY:4}
      batch-report-concurrency: ${AI_BATCH_REPORT_CONCURRENCY:1}
      per-user-turn-concurrency: ${AI_PER_USER_TURN_CONCURRENCY:2}
      per-user-draft-jobs: ${AI_PER_USER_DRAFT_JOBS:3}
    deepseek:
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
      reasoning-effort: ${DEEPSEEK_REASONING_EFFORT:high}
    intent:
      enabled: ${AI_INTENT_ENABLED:true}
      base-url: ${DEEPSEEK_INTENT_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_INTENT_MODEL:${DEEPSEEK_MODEL:deepseek-v4-pro}}
      max-context-chars: ${AI_INTENT_MAX_CONTEXT_CHARS:6000}
    embedding:
      enabled: ${AI_EMBEDDING_ENABLED:true}
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
      dimension: ${AI_EMBEDDING_DIMENSION:1024}
    problem-service-connect-timeout-ms: ${AI_PROBLEM_SERVICE_CONNECT_TIMEOUT_MS:2000}
    problem-service-read-timeout-ms: ${AI_PROBLEM_SERVICE_READ_TIMEOUT_MS:5000}
    problem-service-guard-cache-ttl-ms: ${AI_PROBLEM_SERVICE_GUARD_CACHE_TTL_MS:30000}
    recall:
      cooldown-window-minutes: ${AI_MEMORY_RECALL_COOLDOWN_WINDOW_MINUTES:30}
      cooldown-penalty: ${AI_MEMORY_RECALL_COOLDOWN_PENALTY:0.35}
      confirmed-boost: ${AI_MEMORY_RECALL_CONFIRMED_BOOST:0.10}
    memory-jobs:
      enabled: ${AI_MEMORY_JOBS_ENABLED:true}
      poll-interval-ms: ${AI_MEMORY_JOBS_POLL_INTERVAL_MS:5000}
      batch-size: ${AI_MEMORY_JOBS_BATCH_SIZE:8}
      lease-seconds: ${AI_MEMORY_JOBS_LEASE_SECONDS:60}
      max-attempts: ${AI_MEMORY_JOBS_MAX_ATTEMPTS:3}
      backoff-base-seconds: ${AI_MEMORY_JOBS_BACKOFF_BASE_SECONDS:30}

logging:
  pattern:
    # Every line carries the request's trace id (T2.5); the brackets are empty when there is none.
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        agent:
          include: agentHarness,modelProviders,agentExecutor,agentChannel,problemService
          show-components: always
          show-details: when_authorized
          roles: ADMIN,TEACHER
          status:
            order: down,out-of-service,degraded,up,unknown
            http-mapping:
              down: 503
              out-of-service: 503
              degraded: 200
      # T1.6: agentHarness reports DEGRADED when a scenario lacks a required tool. It ranks below
      # UP, so the overall status (and the compose healthcheck) stays UP, and answers HTTP 200.
      status:
        order: down,out-of-service,up,degraded,unknown
        http-mapping:
          down: 503
          out-of-service: 503
          degraded: 200

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
