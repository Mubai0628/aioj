server:
  port: ${SERVER_PORT:8203}

spring:
  application:
    name: ai-oj-judge-worker
  config:
    import: optional:nacos:${spring.application.name}.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_oj_next?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:aioj}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${JUDGE_DB_POOL_MAX:4}
      minimum-idle: ${JUDGE_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  servlet:
    multipart:
      max-file-size: ${JUDGE_DRAFT_PACKAGE_MAX_UPLOAD:50MB}
      max-request-size: ${JUDGE_DRAFT_PACKAGE_MAX_REQUEST:52MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${JUDGE_PREFETCH:1}
        concurrency: ${JUDGE_CONCURRENCY:1}
        max-concurrency: ${JUDGE_MAX_CONCURRENCY:4}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}

aioj:
  testcase:
    storage-root: ${AIOJ_TESTCASE_STORAGE_ROOT:${user.home}/.ai-oj-next/testcases}
  judge:
    sandbox-endpoint: ${SANDBOX_ENDPOINT:http://localhost:8090/execute}
    sandbox-token: ${SANDBOX_TOKEN:}
    sandbox-timeout: ${SANDBOX_TIMEOUT:PT10S}
    sandbox-read-timeout: ${SANDBOX_READ_TIMEOUT:PT370S}
    language-whitelist: ${JUDGE_LANGUAGE_WHITELIST:java,cpp,python}
    cache-root: ${AIOJ_JUDGE_CACHE_ROOT:${user.home}/.ai-oj-next/judge-cache}
    problem-service-base-url: ${PROBLEM_SERVICE_BASE_URL:http://127.0.0.1:8202}
    internal-api-token: ${AIOJ_INTERNAL_API_TOKEN}
    stdout-base-collect-limit-bytes: ${JUDGE_STDOUT_BASE_COLLECT_LIMIT_BYTES:65536}
    stdout-extra-collect-bytes: ${JUDGE_STDOUT_EXTRA_COLLECT_BYTES:65536}
    stdout-max-collect-limit-bytes: ${JUDGE_STDOUT_MAX_COLLECT_LIMIT_BYTES:4194304}
    stderr-collect-limit-bytes: ${JUDGE_STDERR_COLLECT_LIMIT_BYTES:65536}
    max-source-bytes: ${JUDGE_MAX_SOURCE_BYTES:262144}
    max-input-bytes: ${JUDGE_MAX_INPUT_BYTES:8388608}
    max-batch-size: ${JUDGE_MAX_BATCH_SIZE:200}
    max-batch-input-bytes: ${JUDGE_MAX_BATCH_INPUT_BYTES:33554432}
    max-run-time-limit-millis: ${JUDGE_MAX_RUN_TIME_LIMIT_MILLIS:30000}
    max-script-time-limit-millis: ${JUDGE_MAX_SCRIPT_TIME_LIMIT_MILLIS:180000}
    max-memory-limit-kb: ${JUDGE_MAX_MEMORY_LIMIT_KB:1048576}
    max-process-limit: ${JUDGE_MAX_PROCESS_LIMIT:80}
    max-draft-package-bytes: ${JUDGE_MAX_DRAFT_PACKAGE_BYTES:52428800}
    max-draft-package-uncompressed-bytes: ${JUDGE_MAX_DRAFT_PACKAGE_UNCOMPRESSED_BYTES:104857600}
    max-draft-package-entry-bytes: ${JUDGE_MAX_DRAFT_PACKAGE_ENTRY_BYTES:8388608}
    max-draft-package-entries: ${JUDGE_MAX_DRAFT_PACKAGE_ENTRIES:500}
    max-draft-package-cases: ${JUDGE_MAX_DRAFT_PACKAGE_CASES:200}
    max-draft-package-run-millis: ${JUDGE_MAX_DRAFT_PACKAGE_RUN_MILLIS:540000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
  endpoint:
    health:
      probes:
        enabled: true
